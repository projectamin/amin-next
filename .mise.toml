[tools]
rust = "1.86.0"
cargo-binstall = "1.10.20"
jq   = "1.7.1"

[tools.perl]
version = "5.38.2"
options = ["-Duseshrplib", "-Dusethreads", "-Duselargefiles"]
shims   = ["perl", "cpanm", "prove"]

[plugins]

# Native libraries and compilers required to build the Perl XS modules and
# the bundled C libraries (libblake3, liboqs). Applied by `mise run bootstrap`.
[bootstrap.packages]
"apt:build-essential" = { version = "latest", os = "linux" }
"apt:cmake"           = { version = "latest", os = "linux" }
"apt:pkg-config"      = { version = "latest", os = "linux" }
"apt:libxml2-dev"     = { version = "latest", os = "linux" }
"apt:zlib1g-dev"      = { version = "latest", os = "linux" }
"apt:liblzma-dev"     = { version = "latest", os = "linux" }

[env]
PATH    = "${PWD}/local/bin:${PWD}/bin:${PWD}/target/release:${PWD}/target/debug:${PATH}"
PERL5LIB = "${PWD}/perl-lib:${PWD}/local/lib/perl5"
AMIN_HOME = "${PWD}"
RUST_BACKTRACE = "1"
CARGO_TARGET_DIR = "${PWD}/target"
# Prepend ./local/include and ./local/lib when an XS Makefile.PL runs, without
# replacing that module's own -l flags. Digest::BLAKE3 and Crypt::Liboqs::Sign
# still link the libraries built into ./local; XML::LibXML keeps -lxml2.
PERL5OPT = "-MAmin::MakeMakerLocalLib"
# cpanm needs a writable workdir; $HOME/.cpanm can be a read-only mount in sandboxes.
PERL_CPANM_HOME = "${PWD}/.cache/cpanm"

[hooks]
# After mise install finishes installing the perl/rust tools (or on cd into
# the dir), auto-bootstrap CPAN deps into ./local if they're not already there.
# Skip idempotently when ./local/lib/perl5/XML/SAX/Base.pm exists.
enter = """
set -e
if [ -f \"${PWD}/cpanfile\" ] && [ ! -f \"${PWD}/local/lib/perl5/XML/SAX/Base.pm\" ]; then
  echo \"[hooks.enter] CPAN deps missing, running mise run bootstrap…\" >&2
  mise run bootstrap
fi
"""

postinstall = """
set -e
if [ -f \"${PWD}/cpanfile\" ] && [ ! -f \"${PWD}/local/lib/perl5/XML/SAX/Base.pm\" ]; then
  echo \"[hooks.postinstall] CPAN deps missing after mise install, running mise run bootstrap…\" >&2
  mise run bootstrap
fi
"""

[tasks.bootstrap]
description = "Install CPAN modules + cargo deps for Amin 3.0 (mise-managed perl via cpanm + carton lockfile)"
run = '''
set -e
PREFIX="$(pwd)/local"
export PERL5LIB="${PWD}/perl-lib:$PREFIX/lib/perl5:$PERL5LIB"
export PATH="$PREFIX/bin:$PATH"
mkdir -p "$PREFIX" "${PERL_CPANM_HOME:-$(pwd)/.cache/cpanm}"

# Compilers and native headers (libxml2, zlib, lzma, cmake, pkg-config).
# Declared in [bootstrap.packages]; skipped when already installed.
if ! mise bootstrap packages status --missing; then
  echo "[+] Installing system build packages from [bootstrap.packages]..."
  mise bootstrap packages apply --yes --update
fi

# ── Build & install libblake3 into $PREFIX so Digest::BLAKE3 XS can link ──
# (Digest::BLAKE3 Makefile.PL hardcodes LIBS=-lblake3 with no Alien support;
#  the C dir ships CMakeLists.txt, not a plain Makefile)
if [ ! -f "$PREFIX/lib/libblake3.a" ] && [ ! -f "$PREFIX/lib/libblake3.dylib" ] && [ ! -f "$PREFIX/lib/pkgconfig/blake3.pc" ]; then
  echo "[+] Building libblake3 from source into $PREFIX (no system package needed)..."
  BLAKE3_SRC="$(pwd)/.cache/blake3-src"
  BLAKE3_BUILD="$(pwd)/.cache/blake3-build"
  mkdir -p "$BLAKE3_SRC" "$BLAKE3_BUILD" "$PREFIX"
  curl -sSL https://github.com/BLAKE3-team/BLAKE3/archive/refs/tags/1.8.7.tar.gz \
    | tar -xz -C "$BLAKE3_SRC" --strip-components=1
  (cd "$BLAKE3_BUILD" && cmake "$BLAKE3_SRC/c" -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_POSITION_INDEPENDENT_CODE=ON && make -j$(sysctl -n hw.ncpu 2>/dev/null || echo 4) && make install)
  echo "[+] libblake3 installed into $PREFIX"
fi
# Search paths for the local static libs. Each Makefile.PL keeps its own -l
# flags (Amin::MakeMakerLocalLib only prepends -I/-L). pkg-config is how
# Crypt::Liboqs::Sign and XML::LibXML discover liboqs and libxml2.
export CPPFLAGS="-I$PREFIX/include${CPPFLAGS:+ $CPPFLAGS}"
export LDFLAGS="-L$PREFIX/lib${LDFLAGS:+ $LDFLAGS}"
export CPATH="$PREFIX/include${CPATH:+:$CPATH}"
export LIBRARY_PATH="$PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
export DYLD_FALLBACK_LIBRARY_PATH="$PREFIX/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
pkg_prefix_lib="$PREFIX/lib/pkgconfig"
export PKG_CONFIG_PATH="${pkg_prefix_lib}:${PKG_CONFIG_PATH:-}"

# ── Build & install liboqs into $PREFIX so Crypt::Liboqs::Sign can link ──
# (Crypt::Liboqs::Sign needs the liboqs C library; nothing on CPAN provides
#  ML-DSA-87 without it)
if [ ! -f "$PREFIX/lib/liboqs.a" ] && [ ! -f "$PREFIX/lib/liboqs.dylib" ]; then
  # 0.16.0 = FIPS-204 **final** ML-DSA (0.10.0 shipped the draft; its
  # signatures are incompatible with the ml-dsa crate / FIPS-204 final —
  # same key and sig lengths, different math — and its keypair path was
  # crash-prone in this environment)
  echo "[+] Building liboqs from source into $PREFIX (no system package needed)..."
  OQS_SRC="$(pwd)/.cache/liboqs-src"
  OQS_BUILD="$(pwd)/.cache/liboqs-build"
  mkdir -p "$OQS_SRC" "$OQS_BUILD" "$PREFIX"
  curl -sSL https://github.com/open-quantum-safe/liboqs/archive/refs/tags/0.16.0.tar.gz \
    | tar -xz -C "$OQS_SRC" --strip-components=1
  # OpenSSL-free build: otherwise the static archive drags OpenSSL's private
  # CRYPTO_* allocator symbols in, and the Perl viewer bundle persists
  # `symbol not found … _CRYPTO_free` at dlopen.
  (cd "$OQS_BUILD" && cmake "$OQS_SRC" -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
    -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
    -DOQS_USE_OPENSSL=OFF && make -j$(sysctl -n hw.ncpu 2>/dev/null || echo 4) && make install)
  echo "[+] liboqs installed into $PREFIX"
  # FIPS-204 wire-compat guarantee: link the verify-side Perl wrapper against
  # the liboqs we just built (t/29 cross-verifies against the Rust signer).
  cpanm --notest --force --reinstall --local-lib-contained "$PREFIX" Crypt::Liboqs::Sign
fi

echo "[+] Installing runtime Perl deps (latest stable, --cpanfile no pins)..."
cpanm --notest --local-lib-contained "$PREFIX"  \
      --cpanfile ./cpanfile                     \
      --installdeps .

echo "[+] Installing develop/test Perl deps..."
cpanm --notest --local-lib-contained "$PREFIX"    \
      Test2::Suite Test2::V0 Perl::Tidy Path::Tiny \
      Try::Tiny Devel::Cover Carton

# A local::lib restored from cache may contain an XML::LibXML.so linked
# without -lxml2. cpanm will not rebuild a module it already sees installed.
if ! perl -MXML::LibXML -e 'XML::LibXML->load_xml(string => "<ok/>")' >/dev/null 2>&1; then
  echo "[+] XML::LibXML does not load; rebuilding it against libxml2..."
  cpanm --notest --force --reinstall --local-lib-contained "$PREFIX" XML::LibXML
  perl -MXML::LibXML -e 'XML::LibXML->load_xml(string => "<ok/>")'
fi

# ════════════════════════════════════════════════════════════════════════════
# IPC::Run 20260402.0 upstream compile-order bug hotfix (non-Win32 only).
#
# IPC::Run::IO uses `use IPC::Run qw(Win32_MODE)` at compile-time and calls
# `IPC::Run::_pipe` / `IPC::Run::_pipe_nb` as barewords under strict subs.
# Those symbols are all declared *later* in IPC::Run.pm — AFTER the
# `require IPC::Run::IO` statement — so Linux/BSD perls fail with
# "Bareword not allowed" / "Undefined subroutine" errors at compile time.
#
# Workaround: inject forward declarations (use constant + sub predecls)
# into the installed IPC/Run.pm, just BEFORE the `require IPC::Run::IO`
# line.  Idempotent: gated by an AMIN HOTFIX marker comment.
# Drop this when IPC::Run upstream ships a corrected release.
# ════════════════════════════════════════════════════════════════════════════
RUNPM="$PREFIX/lib/perl5/IPC/Run.pm"
if [ -f "$RUNPM" ] && ! grep -q 'AMIN HOTFIX' "$RUNPM" 2>/dev/null; then
  echo "[+] Applying IPC::Run 20260402.0 compile-order hotfix..."
  chmod u+w "$RUNPM" 2>/dev/null || true
  perl -i -0777 -pe '
    s{^(use IO::Handle;\n)}{
      $1 . "\n"
      . "## AMIN HOTFIX START (IPC::Run 20260402.0 compile-order fix, non-Win32)\n"
      . "## IPC::Run::IO does `use IPC::Run qw(Win32_MODE)` at compile-time and\n"
      . "## calls IPC::Run::_pipe / IPC::Run::_pipe_nb as barewords under strict.\n"
      . "## Forward-declare them here so IO.pm resolves cleanly; real defs live below.\n"
      . "use constant Win32_MODE => \$^O =~ /os2|Win32/i;\n"
      . "sub _pipe;\n"
      . "sub _pipe_nb;\n"
      . "## AMIN HOTFIX END\n\n"
    }mse;
  ' "$RUNPM"
fi

if [ -x "$PREFIX/bin/carton" ]; then
  echo "[+] Writing Carton lockfile (cpanfile.snapshot)..."
  PERL5LIB="$PREFIX/lib/perl5" "$PREFIX/bin/carton" check >/dev/null 2>&1 || true
  (PERL5LIB="$PREFIX/lib/perl5"; export PERL5LIB
   "$PREFIX/bin/carton" install --cpanfile ./cpanfile >/dev/null 2>&1 || true)
fi

echo "[+] Running cargo fetch..."
(cd rust/ && cargo fetch || true)
echo "[+] Building bctool (ML-DSA-87 zcap-signer + slab tool for tests)..."
cargo build -p bitcache --manifest-path rust/Cargo.toml
echo "[+] Building aminexec (sandbox executor ABI — fail-closed sandbox_missing_abi when backends unavailable)..."
cargo build -p aminexec --manifest-path rust/Cargo.toml

echo "[+] Bootstrap complete. Use \`mise run test\` to run the suite."
'''

[tasks.cpan-outdated]
description = "List outdated CPAN modules (safe; no install)"
run = '''
PREFIX="$(pwd)/local"
export PERL5LIB="${PWD}/perl-lib:$PREFIX/lib/perl5:$PERL5LIB"
export PATH="$PREFIX/bin:$PATH"
cpan-outdated -p || true
'''

[tasks.cpan-upgrade]
description = "Upgrade one pinned module NAME=... to latest stable, then refresh snapshot"
run = '''
: "${NAME:?usage: mise run cpan-upgrade NAME=IPC::Run}"
PREFIX="$(pwd)/local"
export PERL5LIB="${PWD}/perl-lib:$PREFIX/lib/perl5:$PERL5LIB"
export PATH="$PREFIX/bin:$PATH"
cpanm --notest --local-lib-contained "$PREFIX" "$NAME"
if [ -x "$PREFIX/bin/carton" ]; then
  PERL5LIB="$PREFIX/lib/perl5" "$PREFIX/bin/carton" install --cpanfile ./cpanfile || true
fi
echo "[+] Upgraded $NAME - remember to bump the requires() line in cpanfile + commit cpanfile.snapshot"
'''

[tasks.test]
description = "Run full test suite: Perl unit tests + Rust integration tests"
run = '''
set -e
mise exec -- prove -v -r t/
echo "---"
(cd rust && cargo test --workspace)
'''

[tasks.app]
description = "Serve the shop-ui example app over HTTP (AXA) — http://localhost:8787 (v4+v6 loopback)"
run = '''
exec perl -I perl-lib bin/amin axa serve examples/apps/shop-ui --listen localhost:8787
'''
