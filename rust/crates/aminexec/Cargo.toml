[package]
name         = "aminexec"
version      = "0.1.0"
description  = "Amin 3.0 execution dispatcher: per-process sandbox, cgroup metrics, platform trait stubs for Linux/FreeBSD/iOS/Android"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true

[lib]
name    = "aminexec"
path    = "src/lib.rs"

[[bin]]
name    = "aminexec"
path    = "src/main.rs"

[features]
default = []
# Strong isolation on recent Linux kernels (>=6.2) — deps added as local-path crates later
linux-strict  = []
# POSIX minimal fallback — no sandbox, only fork/exec + rusage
posix-minimal = []
# Enables FFI bridging to Objective-C Runtime (iOS)
ios-ffi       = []
# Enables JNI binding to ART / Android Runtime
android-jni   = []

[dependencies]
tokio.workspace           = true
anyhow.workspace          = true
thiserror.workspace       = true
tracing.workspace         = true
tracing-subscriber.workspace = true
libc.workspace            = true
tempfile.workspace        = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Linux-only enforcing deps. Every usage lives behind
# cfg(target_os = "linux") (platform/mod.rs backend macro; the main.rs
# seccomp/NO_NEW_PRIVS block), and rtnetlink's netlink crates reference
# Linux-only libc symbols, so they must not be compiled on macOS/FreeBSD.
[target.'cfg(target_os = "linux")'.dependencies]
nix                       = { workspace = true }
rtnetlink                 = { workspace = true }
futures                   = { workspace = true }

[build-dependencies]
# Placeholder build deps for BPF programs. We intentionally do NOT pull in
# libbpf-cargo at build time because it requires clang on the host, and the
# vendor assumption was false (see spec OQ-1 fallback path). Instead BPF
# clsact programs are pre-compiled as base64-encoded byte blobs inside
# linux.rs BPF_PROG_P2C_EWMA_BYTES / BPF_PROG_NETPOLICY_BYTES constants —
# pure Rust build, zero clang dep (resolves spec OQ-1 into fallback).
#
# libbpf-cargo = { version = "0.22" }
# libbpf-sys = { version = "1.4", features = ["vendored"] }
