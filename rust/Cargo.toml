[workspace]
resolver = "2"
members  = ["crates/awp3", "crates/aminexec", "crates/bsax", "crates/bitcache", "crates/ainit", "crates/ratchet", "crates/amin-sax", "crates/amin-machine", "crates/amin-proxy"]

[workspace.package]
version      = "3.0.0"
edition      = "2021"
rust-version = "1.86"
license      = "BSD-2-Clause"
homepage     = "https://projectamin.org"
repository   = "https://github.com/projectamin/amin-3"

[workspace.dependencies]
# ── First-party crates ───────────────────────────────────────────────────
amin-sax              = { path = "crates/amin-sax" }
amin-machine          = { path = "crates/amin-machine" }

blake3                = "1.5"
cpufeatures           = "0.2"
reed-solomon-16       = "0.1"
libc                  = "0.2"
# ── Post-quantum signatures (legacy 2014 Bitcache used RSA-2048; Amin 3.0
#    carries forward the <bc:signer> envelope primitive with ML-DSA-87).
ml-dsa                = "0.1.1"

# ── Double Ratchet / PQXDH (ratchet crate): hybrid PQ key agreement
#    (ML-KEM-768 + X25519) + HKDF/HMAC KDF chains + XChaCha20-Poly1305 AEAD.
ml-kem                = "0.2"
x25519-dalek          = { version = "2", features = ["static_secrets"] }
hkdf                  = "0.12"
hmac                  = "0.12"
sha2                  = "0.10"
# Keccak/SHA-3 — the compiled-profile fingerprint the front stamps on
# responses (`X-Amin-Profile-SHA3`, proxy-plan §P5).
sha3                  = "0.10"
chacha20poly1305      = "0.10"
# ── AWP/3 transport (awp3 crate): composite signatures (ML-DSA-65 + Ed25519)
#    and the ASCON-128a per-frame AEAD.
ed25519-dalek         = { version = "2", default-features = false, features = ["alloc"] }
ascon-aead            = "0.2"
zeroize               = { version = "1", features = ["derive"] }
rand                  = "0.8"

# ── Wire + transport ─────────────────────────────────────────────────────
quinn                 = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
rustls                = { version = "0.23", default-features = false }
tokio                 = { version = "1",    default-features = false, features = ["rt-multi-thread","macros","net","sync","io-util"] }
bytes                 = "1.6"
http                  = "1"
anyhow                = "1"
thiserror             = "1"

# ── Safe kernel-ABI wrappers (aminexec Linux backend) ────────────────────
nix                   = { version = "0.29", default-features = false, features = ["sched", "mman", "process", "signal"] }
rtnetlink             = "0.13"
bytemuck              = { version = "1", features = ["derive"] }
futures               = "0.3"

# ── Observability ────────────────────────────────────────────────────────
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }
tempfile              = "3"

[profile.release]
lto            = "fat"
codegen-units  = 1
panic          = "abort"
strip          = "symbols"
opt-level      = 3
overflow-checks = true

[profile.dev]
overflow-checks = true
