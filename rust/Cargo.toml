[workspace]
resolver = "2"
members  = ["crates/awp3", "crates/aminexec", "crates/bsax", "crates/bitcache", "crates/ainit"]

[workspace.package]
version      = "3.0.0"
edition      = "2021"
rust-version = "1.86"
license      = "BSD-2-Clause"
homepage     = "https://projectamin.org"
repository   = "https://github.com/projectamin/amin-3"

[workspace.dependencies]
blake3                = "1.5"
cpufeatures           = "0.2"
reed-solomon-16       = "0.1"
libc                  = "0.2"
# ── Post-quantum signatures (legacy 2014 Bitcache used RSA-2048; Amin 3.0
#    carries forward the <bc:signer> envelope primitive with ML-DSA-87).
ml-dsa                = "0.1.1"

# ── Wire + transport ─────────────────────────────────────────────────────
quinn                 = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
rustls                = { version = "0.23", default-features = false }
tokio                 = { version = "1",    default-features = false, features = ["rt-multi-thread","macros","net","sync","io-util"] }
bytes                 = "1.6"
http                  = "1"
anyhow                = "1"
thiserror             = "1"

# ── Safe kernel-ABI wrappers (aminexec Linux backend) ────────────────────
nix                   = { version = "0.29", default-features = false, features = ["sched", "mman", "process", "signal"] }
rtnetlink             = "0.13"
bytemuck              = { version = "1", features = ["derive"] }
futures               = "0.3"

# ── Observability ────────────────────────────────────────────────────────
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }
tempfile              = "3"

[profile.release]
lto            = "fat"
codegen-units  = 1
panic          = "abort"
strip          = "symbols"
opt-level      = 3
overflow-checks = true

[profile.dev]
overflow-checks = true
